[project]
name = "soccer-tactics-agent"
version = "0.1.0"
description = "A reproducible, evidence-bound soccer tactics analyst"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [{ name = "Aayush Chanda" }]
dependencies = [
  "azure-identity>=1.25,<2",
  "deepagents==0.7.7",
  "duckdb>=1.4,<2",
  "fastapi>=0.119,<1",
  "httpx>=0.28,<1",
  "kloppy>=3.18,<4",
  "langchain-ollama>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "networkx>=3.5,<4",
  "numpy>=2.3,<3",
  "platformdirs>=4.4,<5",
  "polars>=1.34,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "typer>=0.19,<1",
  "uvicorn[standard]>=0.37,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.2,<2", "respx>=0.22,<1", "ruff>=0.14,<1"]

[project.scripts]
soccer-tactics = "soccer_tactics.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soccer_tactics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires downloaded Metrica sample data", "live: requires a configured model provider"]

[tool.ruff]
target-version = "py314"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
